name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          # Full history is required for the upstream merge below.
          fetch-depth: 0
          # Credentials must persist so the push step can authenticate.
          persist-credentials: true

      - name: Configure Git author
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Beingpax/VoiceInk.git
          git fetch upstream

      - name: Merge upstream main
        run: |
          git merge --ff-only upstream/main || git merge upstream/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/cloudflare-asr/package-lock.json

      - name: Validate merged web application
        working-directory: web
        run: |
          npm ci
          npm ci --prefix cloudflare-asr --ignore-scripts
          npm run check

      - name: Push validated merge
        run: |
          git push origin main
